<title>Esboços das cartas</title>

<style>
html,body{margin:0;background:transparent}
.sheet{display:grid;grid-template-columns:repeat(6,520px);grid-auto-rows:416px}

.cell svg{width:392px;height:392px;overflow:visible;filter:url(#wobble)}
.ln{fill:none;stroke:var(--ink);stroke-width:var(--sw);stroke-linecap:round;stroke-linejoin:round}
.th{stroke-width:calc(var(--sw) * .6)}.bw{stroke-width:calc(var(--sw) * 1.5)}
.fl{fill:var(--fill);stroke:var(--ink);stroke-width:var(--sw);stroke-linejoin:round}
.sh{fill:url(#pencil)}.xh{fill:url(#xh)}.dk{fill:var(--ink)}
.ac{fill:var(--acc);stroke:var(--ink);stroke-width:var(--sw)}
.gl{fill:none;stroke:var(--glow);stroke-width:calc(var(--sw) * .8);stroke-linecap:round}
.sk2{opacity:.35;transform:translate(.9px,.7px) rotate(.5deg)}
.mon{--ink:#4a120b;--acc:#8e1a10;--glow:#4a120b}

.spl{--ink:#3a2580;--acc:#7a3fd0;--glow:#7a3fd0}

.fin{--ink:#1a1410;--acc:#b8902a;--glow:#b8902a}
.ink{--ink:#2a1e16;--acc:#7e1710;--glow:#2a1e16}

.spl svg{filter:url(#wobble) drop-shadow(0 0 5px rgba(122,63,208,.45))}
.fin svg{filter:url(#wobble) drop-shadow(0 0 4px rgba(184,144,42,.35))}
</style>
