input{cursor:text}

.dirty{color:var(--acc);font-weight:700}
.deck{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:150px;overflow:auto}

.chip img,.chip .ph{width:28px;height:42px;object-fit:cover;border-radius:3px;background:#0002}
.chip button{padding:0 6px;border-width:1px;font-size:14px}
main{padding:12px 16px 60px}
h2{font-size:16px;margin:18px 0 8px;border-bottom:1px solid var(--line);padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.c{position:relative;background:var(--card);border:3px solid var(--line);border-radius:10px;overflow:hidden}
.c.in{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok)}
.c img,.c .ph{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#0002}
.ph{display:flex;align-items:center;justify-content:center;color:var(--mut)}
.nm{padding:4px 6px 0;font-weight:600;font-size:13px}.ds{padding:2px 6px;font-size:12px}.mt{padding:0 6px 6px;font-size:11px;color:var(--mut)}
.cost{position:absolute;top:4px;left:4px;background:#1b2a6b;color:#fff;border-radius:50%;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
.rar{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;border:1px solid #0006}
.r-common{background:#bbb}.r-uncommon{background:#4caf50}.r-rare{background:#3b82f6}.r-legendary{background:#f5a623}
.qty{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px;border-top:1px solid var(--line)}
.qty button{width:34px;font-weight:700;font-size:18px;padding:0}.qty b{min-width:28px;text-align:center;font-size:18px}
.toast{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.note{font-size:12px;color:var(--mut);margin-top:6px}
</style></head><body>

const ro={common:0,uncommon:1,rare:2,legendary:3};
const sortC=a=>a.slice().sort((x,y)=>ro[x.rarity]-ro[y.rarity]||x.cost-y.cost||x.name.localeCompare(y.name));
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1800)};
const n=(v,id)=>S[v].filter(x=>x==id).length;
const img=c=>c.art?'<img loading="lazy" src="../assets/cards/'+c.id+'.png">':'<div class="ph">sem arte</div>';
const types=[...new Set(D.cards.map(c=>c.type||c.cat).filter(Boolean))].sort();
document.getElementById("ft").innerHTML+=types.map(t=>'<option>'+t+'</option>').join("");
function sortDeck(a){const m={};a.forEach(i=>m[i]=(m[i]||0)+1);
 return sortC(Object.keys(m).map(i=>byId[i])).flatMap(c=>Array(m[c.id]).fill(c.id))}
function out(){const o={};D.villains.forEach(v=>{o[v.id]=sortDeck(S[v.id])});return JSON.stringify(o,null,1)}
function render(){
 const dirty=JSON.stringify(S)!=snap;
 document.getElementById("tabs").innerHTML=D.villains.map(v=>'<button class="tab '+(v.id==cur?'on':'')+'" data-v="'+v.id+'">'+v.name+' ('+S[v.id].length+' cartas)</button>').join("");
 document.getElementById("st").textContent=dirty?"● alterações não salvas":"";
 const m={};S[cur].forEach(i=>m[i]=(m[i]||0)+1);
 document.getElementById("deck").innerHTML=sortC(Object.keys(m).map(i=>byId[i])).map(c=>'<div class="chip" data-id="'+c.id+'">'+img(c)+'<span>'+c.name+' ×'+m[c.id]+'</span><button data-d="-1">−</button><button data-d="1">+</button></div>').join("")||"(deck vazio)";
 const q=document.getElementById("q").value.toLowerCase(),fo=document.getElementById("fo").value,fr=document.getElementById("fr").value,ft=document.getElementById("ft").value,fi=document.getElementById("fi").value;
 const ok=c=>{if(fo=="pool"&&c.owner!=cur&&c.owner!="common")return false;
  if(q&&!c.name.toLowerCase().includes(q)&&!c.id.includes(q))return false;
  if(fr&&c.rarity!=fr)return false;if(ft&&(c.type||c.cat)!=ft)return false;
  const k=n(cur,c.id);if(fi=="in"&&!k)return false;if(fi=="out"&&k)return false;return true};
 const groups=[["Cartas de "+D.villains.find(v=>v.id==cur).name.split(" ")[0],c=>c.owner==cur],["Comuns",c=>c.owner=="common"],["De outros vilões",c=>c.owner!=cur&&c.owner!="common"]];
 document.getElementById("main").innerHTML=groups.map(([t,f])=>{const l=sortC(D.cards.filter(c=>f(c)&&ok(c)));
  return l.length?'<h2>'+t+' ('+l.length+')</h2><div class="grid">'+l.map(card).join("")+'</div>':""}).join("")}
function card(c){const k=n(cur,c.id);
 return '<div class="c '+(k?'in':'')+'" data-id="'+c.id+'">'+img(c)+'<div class="cost">'+c.cost+'</div><div class="rar r-'+c.rarity+'" title="'+c.rarity+'"></div><div class="nm">'+c.name+'</div><div class="ds">'+c.desc+'</div><div class="mt">'+(c.type||c.cat)+' · '+c.rarity+(c.hp?' · vida '+c.hp:'')+(c.dps?' · dps '+c.dps:'')+(c.count>1?' · x'+c.count:'')+'</div><div class="qty"><button data-d="-1">−</button><b>'+k+'</b><button data-d="1">+</button></div></div>'}
document.addEventListener("click",e=>{
 const t=e.target.closest(".tab");if(t){cur=t.dataset.v;return render()}
 const b=e.target.closest("[data-d]");if(!b)return;
 const id=b.closest("[data-id]").dataset.id,d=+b.dataset.d,y=scrollY;
 if(d>0)S[cur].push(id);else{const i=S[cur].indexOf(id);if(i>=0)S[cur].splice(i,1)}
 render();scrollTo(0,y)});
["q","fo","fr","ft","fi"].forEach(i=>document.getElementById(i).addEventListener("input",render));
document.getElementById("save").onclick=()=>{try{localStorage.setItem(KEY,out())}catch(e){}snap=JSON.stringify(S);render();toast("Salvo neste navegador")};
document.getElementById("revert").onclick=()=>{if(!confirm("Voltar os 3 decks para os originais do jogo?"))return;D.villains.forEach(v=>S[v.id]=ORIG[v.id].slice());render()};
document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(out());toast("Decks copiados — cole no chat")}catch(e){prompt("Copie:",out())}};
document.getElementById("dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([out()],{type:"application/json"}));a.download="deck_base.json";a.click()};
render();
</script></body></html>
