<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vitrine dos modelos</title>
<style>
:root{
  --paper:#efe4cc; --paper2:#e6d7b6; --card:#f7efdc; --ink:#2b2117; --muted:#6f5f4b; --line:#cdb98f;
  --red:#a3262a; --red2:#c8463c; --green:#3d7a3a; --gold:#b58a2e; --shadow:0 2px 10px rgba(60,40,10,.18);
  --stage:#d9cba8;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#1d1814; --paper2:#251f19; --card:#2b241d; --ink:#eee3cc; --muted:#b3a48a; --line:#4a3e31;
    --red:#d9554d; --red2:#e9726a; --green:#6fae67; --gold:#d6ad55; --shadow:0 2px 12px rgba(0,0,0,.5); --stage:#3a3128;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 Georgia,"Times New Roman",serif}
header{position:sticky;top:0;z-index:20;background:var(--paper2);border-bottom:2px solid var(--line);box-shadow:var(--shadow)}
.bar{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
h1{margin:0;font-size:22px;letter-spacing:.5px}
h1 small{font-size:13px;color:var(--muted);font-weight:normal;margin-left:6px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tab{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
.tab.on{background:var(--red);border-color:var(--red);color:#fff}
.tab .n{font-size:12px;opacity:.8;margin-left:4px}
.right{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:14px;color:var(--muted)}
.prog{width:160px;height:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);width:0}
main{max-width:1500px;margin:0 auto;padding:16px}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}

/* galeria: todos girando juntos */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);position:relative}
.tile canvas{display:block;width:100%;aspect-ratio:1;background:var(--stage)}
.tile .t{padding:6px 9px;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.tile .f{color:var(--muted);font-size:11px}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;align-self:flex-start}
.badge.aprovado{background:var(--green);border-color:var(--green);color:#fff}
.badge.rejeitado{background:var(--red);border-color:var(--red);color:#fff}

/* peça */
.piece{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin:0 0 22px;overflow:hidden}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--paper2)}
.ph h2{margin:0;font-size:21px}
.ph .fr{color:var(--muted);font-size:13px}
.ph code{font-size:12px;background:var(--paper);border:1px solid var(--line);padding:1px 6px;border-radius:5px}
.ph .badge{margin-left:auto;font-size:13px;padding:2px 10px}
.stage{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,.62fr);gap:12px;padding:12px}
.box{background:var(--stage);border-radius:10px;position:relative;overflow:hidden;min-height:120px;display:flex;align-items:center;justify-content:center}
.box .lbl{position:absolute;left:8px;top:6px;font-size:12px;background:rgba(0,0,0,.55);color:#fff;padding:1px 8px;border-radius:99px;pointer-events:none}
.spin canvas{width:100%;aspect-ratio:1;display:block;cursor:grab;touch-action:none}
.spin canvas:active{cursor:grabbing}
.spin .ctl{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.spin .ctl button{font:inherit;font-size:12px;border:0;border-radius:99px;padding:3px 10px;background:rgba(0,0,0,.55);color:#fff;cursor:pointer}
.box video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
.box img.cardart{width:100%;height:100%;object-fit:contain;display:block;cursor:zoom-in}
.empty{color:var(--muted);font-size:13px;padding:20px;text-align:center}
.ingame{padding:0 12px 12px}
.ingame h3{margin:6px 2px 8px;font-size:14px;color:var(--muted);font-weight:normal}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col h4{margin:0 0 6px;font-size:13px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.thumbs img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;cursor:zoom-in;border:1px solid var(--line);display:block}
.desc{padding:0 16px 8px;margin:0}
.act{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px 14px;border-top:1px solid var(--line)}
.act button{font:inherit;font-size:14px;border-radius:8px;border:1px solid var(--line);padding:6px 14px;cursor:pointer;background:var(--paper);color:var(--ink)}
.act .ok{background:var(--green);border-color:var(--green);color:#fff}
.act .no{background:var(--red);border-color:var(--red);color:#fff}
.act textarea{flex:1 1 320px;min-height:36px;font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);resize:vertical}
.saved{font-size:12px;color:var(--muted);min-width:70px}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:50}
.lb.on{display:flex}
.lb img{max-width:96vw;max-height:92vh;border-radius:6px}
.lb .x{position:absolute;right:16px;top:10px;color:#fff;font-size:30px;cursor:pointer;background:none;border:0}
.lb .nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:44px;background:none;border:0;cursor:pointer;padding:10px}
.lb .pv{left:8px}.lb .nx{right:8px}
@media (max-width:1000px){.stage{grid-template-columns:1fr 1fr}.stage .art{grid-column:span 2;max-height:420px}}
@media (max-width:640px){.stage{grid-template-columns:1fr}.stage .art{grid-column:auto}.pair{grid-template-columns:1fr}.right{margin-left:0}}
</style>
</head>
<body>
<header><div class="bar">
  <h1>Vitrine dos modelos <small>Last Boss · rodada de 20/11</small></h1>
  <div class="tabs" id="tabs"></div>
  <div class="right"><label><input type="checkbox" id="pend"> só pendentes</label><span id="cnt"></span><div class="prog"><i id="pg"></i></div></div>
</div></header>
<main>
  <p class="hint" id="hint"></p>
  <div id="view"><p class="empty">Carregando os modelos… (leva alguns segundos)</p></div>
</main>
<div class="lb" id="lb"><button class="x" id="lbx" aria-label="fechar">×</button><button class="nav pv" id="lbp" aria-label="anterior">‹</button><img id="lbi" alt=""><button class="nav nx" id="lbn" aria-label="próxima">›</button></div>
<script>
const FRENTES = ["Modelos 3D", "Inimigos novos", "Estruturas novas", "Golpes e animações"];
let ITENS = [], AP = {}, tab = "Galeria", spinners = [];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cardId = it => it.id.replace(/^(inimigo|estrutura|modelo)_/, "");
const isPiece = it => it.frente !== "Golpes e animações";
const status = it => (AP[it.id] && AP[it.id].decisao) || "pendente";
const newImgs = it => Object.values(it.variacoes || {})[0] || [];
const varName = it => Object.keys(it.variacoes || {})[0] || null;

async function load(){
  const [a, b] = await Promise.all([fetch("/api/itens").then(r => r.json()), fetch("/api/aprovacoes").then(r => r.json())]);
  ITENS = a.itens.filter(i => FRENTES.includes(i.frente)).sort((x, y) => FRENTES.indexOf(x.frente) - FRENTES.indexOf(y.frente));
  AP = b || {};
  render();
}

function counts(){
  const done = ITENS.filter(i => status(i) !== "pendente").length;
  $("#cnt").textContent = `${done} de ${ITENS.length} decididos`;
  $("#pg").style.width = (ITENS.length ? 100 * done / ITENS.length : 0) + "%";
}

function renderTabs(){
  const all = ["Galeria", ...FRENTES];
  $("#tabs").innerHTML = all.map(f => {
    const n = f === "Galeria" ? ITENS.filter(isPiece).length : ITENS.filter(i => i.frente === f).length;
    return `<button class="tab ${f === tab ? "on" : ""}" data-f="${esc(f)}">${esc(f)}<span class="n">${n}</span></button>`;
  }).join("");
  $("#tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => { tab = b.dataset.f; render(); scrollTo(0, 0); });
}

function stopSpinners(){ spinners.forEach(s => s.stop()); spinners = []; }

function render(){
  stopSpinners(); renderTabs(); counts();
  const pend = $("#pend").checked;
  const v = $("#view");
  if (!ITENS.length){ v.innerHTML = `<p class="empty">Nenhum item das frentes novas ainda.</p>`; return; }
  if (tab === "Galeria"){
    $("#hint").textContent = "Todos os modelos novos girando juntos, para julgar o conjunto. Clique num para abrir a ficha dele.";
    const list = ITENS.filter(isPiece).filter(i => !pend || status(i) === "pendente");
    v.innerHTML = `<div class="grid">${list.map(it => `
      <div class="tile" data-id="${esc(it.id)}"><canvas width="360" height="360"></canvas>
        <div class="t"><div>${esc(it.titulo)}<div class="f">${esc(it.frente)}</div></div><span class="badge ${status(it)}">${status(it)}</span></div></div>`).join("")}</div>`;
    v.querySelectorAll(".tile").forEach(t => {
      const it = ITENS.find(i => i.id === t.dataset.id);
      spinners.push(makeSpinner(t.querySelector("canvas"), it.modelo360 || [], {drag: false, fallback: newImgs(it)[0]}));
      t.onclick = () => { tab = it.frente; render(); requestAnimationFrame(() => document.getElementById("p_" + it.id)?.scrollIntoView({behavior: "smooth", block: "start"})); };
    });
    return;
  }
  $("#hint").textContent = "Arraste o giro para virar o modelo; clique nas fotos para ampliar. Os botões gravam na hora (mesmo arquivo da página de aprovação). Teclas N / P: próxima / anterior.";
  const list = ITENS.filter(i => i.frente === tab).filter(i => !pend || status(i) === "pendente");
  v.innerHTML = list.map(pieceHTML).join("") || `<p class="empty">Nada pendente nesta frente.</p>`;
  list.forEach(it => {
    const el = document.getElementById("p_" + it.id);
    const cv = el.querySelector(".spin canvas");
    if (cv){
      const sp = makeSpinner(cv, it.modelo360 || [], {drag: true});
      spinners.push(sp);
      const bt = el.querySelector(".spin .play");
      bt.onclick = () => { sp.toggle(); bt.textContent = sp.playing() ? "pausar" : "girar"; };
    }
    el.querySelectorAll("img[data-lb]").forEach(img => img.onclick = () => openLB(JSON.parse(img.dataset.lb), +img.dataset.i));
    el.querySelectorAll("[data-dec]").forEach(b => b.onclick = () => decide(it, b.dataset.dec, el));
    const ta = el.querySelector("textarea");
    ta.onchange = () => { if (status(it) !== "pendente") decide(it, status(it), el); };
  });
}

function pieceHTML(it){
  const st = status(it), cm = (AP[it.id] && AP[it.id].comentario) || "";
  const imgsNew = newImgs(it), imgsOld = it.antes || [];
  const vids = it.videos || [];
  const piece = isPiece(it);
  const art = piece && it.frente !== "Modelos 3D" ? `/f/0/assets/cards/${encodeURIComponent(cardId(it))}.png` : null;
  const lbAll = JSON.stringify([...imgsOld, ...imgsNew]);
  const thumbs = (arr, off) => arr.map((u, k) => `<img src="${u}" alt="" loading="lazy" data-lb='${esc(lbAll)}' data-i="${off + k}">`).join("");
  let stage;
  if (piece){
    stage = `<div class="stage">
      <div class="box spin"><span class="lbl">giro 360°</span>${(it.modelo360 || []).length ? `<canvas width="720" height="720"></canvas><div class="ctl"><button class="play">pausar</button></div>` : `<div class="empty">sem giro</div>`}</div>
      <div class="box"><span class="lbl">no jogo: andar e golpe</span>${vids.length ? `<video src="${vids[vids.length - 1]}" autoplay loop muted playsinline controls></video>` : (imgsNew[0] ? `<img class="cardart" src="${imgsNew[0]}" data-lb='${esc(lbAll)}' data-i="${imgsOld.length}" alt="">` : `<div class="empty">sem clipe</div>`)}</div>
      <div class="box art"><span class="lbl">${art ? "arte da carta" : "como era"}</span>${art ? `<img class="cardart" src="${art}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'empty',textContent:'sem arte de carta'}))">` : (imgsOld[0] ? `<img class="cardart" src="${imgsOld[0]}" data-lb='${esc(lbAll)}' data-i="0" alt="">` : `<div class="empty">—</div>`)}</div>
    </div>`;
  } else {
    stage = `<div class="stage" style="grid-template-columns:1fr 1fr">
      <div class="box"><span class="lbl">antes</span>${vids[0] ? `<video src="${vids[0]}" autoplay loop muted playsinline controls></video>` : ""}</div>
      <div class="box"><span class="lbl">depois</span>${vids[1] ? `<video src="${vids[1]}" autoplay loop muted playsinline controls></video>` : ""}</div></div>`;
  }
  return `<section class="piece" id="p_${esc(it.id)}">
    <div class="ph"><h2>${esc(it.titulo)}</h2><span class="fr">${esc(it.frente)}</span><code>${esc(it.flag || "")}</code><span class="badge ${st}">${st}</span></div>
    ${stage}
    <p class="desc">${esc(it.descricao)}</p>
    <div class="ingame"><h3>No jogo (mesma cena e enquadramento)</h3><div class="pair">
      <div class="col"><h4>Antes</h4><div class="thumbs">${thumbs(imgsOld, 0) || '<span class="empty">—</span>'}</div></div>
      <div class="col"><h4>Depois</h4><div class="thumbs">${thumbs(imgsNew, imgsOld.length) || '<span class="empty">—</span>'}</div></div>
    </div></div>
    <div class="act">
      <button class="ok" data-dec="aprovado">Aprovar</button>
      <button class="no" data-dec="rejeitado">Rejeitar</button>
      <button data-dec="pendente">Voltar a pendente</button>
      <textarea placeholder="Comentário (o que mudar, se rejeitar)">${esc(cm)}</textarea>
      <span class="saved"></span>
    </div></section>`;
}

async function decide(it, dec, el){
  const ta = el.querySelector("textarea");
  const r = await fetch("/api/decidir", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({id: it.id, decisao: dec, variacao: dec === "aprovado" ? varName(it) : null, comentario: ta.value})});
  const j = await r.json();
  if (j.ok){
    AP = j.aprovacoes;
    const b = el.querySelector(".ph .badge"); const st = status(it);
    b.className = "badge " + st; b.textContent = st;
    el.querySelector(".saved").textContent = "gravado";
    setTimeout(() => { const s = el.querySelector(".saved"); if (s) s.textContent = ""; }, 1500);
    counts();
  } else {
    el.querySelector(".saved").textContent = "erro: " + (j.error || r.status);
  }
}

/* giro: troca os quadros num canvas; gira sozinho, arrastar vira à mão */
function makeSpinner(cv, urls, opt){
  const ctx = cv.getContext("2d"), frames = [];
  let i = 0, playing = true, timer = null, alive = true, dragX = null, acc = 0;
  const draw = () => {
    const im = frames[i];
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (!im || !im.complete || !im.naturalWidth) return;
    const s = Math.min(cv.width / im.naturalWidth, cv.height / im.naturalHeight);
    const w = im.naturalWidth * s, h = im.naturalHeight * s;
    ctx.drawImage(im, (cv.width - w) / 2, (cv.height - h) / 2, w, h);
  };
  const list = urls.length ? urls : (opt.fallback ? [opt.fallback] : []);
  list.forEach((u, k) => { const im = new Image(); im.onload = () => { if (k === i) draw(); }; im.src = u; frames.push(im); });
  const tick = () => { if (!alive) return; if (playing && frames.length > 1){ i = (i + 1) % frames.length; draw(); } timer = setTimeout(tick, 130); };
  tick();
  if (opt.drag){
    cv.addEventListener("pointerdown", e => { dragX = e.clientX; acc = 0; playing = false; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener("pointermove", e => {
      if (dragX === null || frames.length < 2) return;
      acc += e.clientX - dragX; dragX = e.clientX;
      const step = cv.clientWidth / frames.length / 1.5;
      while (Math.abs(acc) >= step){ i = (i + (acc > 0 ? 1 : -1) + frames.length) % frames.length; acc -= Math.sign(acc) * step; }
      draw();
    });
    const up = () => { dragX = null; const bt = cv.parentElement.querySelector(".play"); if (bt) bt.textContent = "girar"; };
    cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  }
  return {stop(){ alive = false; clearTimeout(timer); }, toggle(){ playing = !playing; }, playing: () => playing};
}

/* ampliar */
let LB = [], LBi = 0;
function openLB(arr, k){ LB = arr; LBi = k; $("#lbi").src = LB[LBi]; $("#lb").classList.add("on"); }
const lbMove = d => { if (!LB.length) return; LBi = (LBi + d + LB.length) % LB.length; $("#lbi").src = LB[LBi]; };
$("#lbx").onclick = () => $("#lb").classList.remove("on");
$("#lb").onclick = e => { if (e.target.id === "lb") $("#lb").classList.remove("on"); };
$("#lbp").onclick = () => lbMove(-1); $("#lbn").onclick = () => lbMove(1);
document.addEventListener("keydown", e => {
  if ($("#lb").classList.contains("on")){
    if (e.key === "Escape") $("#lb").classList.remove("on");
    if (e.key === "ArrowLeft") lbMove(-1);
    if (e.key === "ArrowRight") lbMove(1);
    return;
  }
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "n" || e.key === "p"){
    const secs = [...document.querySelectorAll(".piece")];
    if (!secs.length) return;
    const y = scrollY + 90;
    let k = secs.findIndex(s => s.offsetTop > y);
    if (e.key === "n"){ (secs[k < 0 ? secs.length - 1 : k]).scrollIntoView({behavior: "smooth"}); }
    else { const prev = secs.filter(s => s.offsetTop < y - 10); (prev[prev.length - 1] || secs[0]).scrollIntoView({behavior: "smooth"}); }
  }
});
$("#pend").onchange = render;
load();
</script>
</body>
</html>
