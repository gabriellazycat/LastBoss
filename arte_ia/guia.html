<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guia de Arte</title>
<style>
:root{--bg:#1d1a17;--panel:#2a2622;--ink:#ece4d6;--mute:#a59a8a;--line:#3d3730;--acc:#d9a441;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,Segoe UI,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(29,26,23,.95);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
h1{font-size:16px;margin:0 8px 0 0}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:99px;padding:3px 10px;cursor:pointer;font:inherit}
.chip.on{border-color:var(--acc);color:var(--acc)}
a{color:var(--acc)}
.wrap{overflow-x:auto;padding:12px 16px 40px}
table{border-collapse:separate;border-spacing:10px;min-width:900px}
th{font-weight:600;text-align:left;vertical-align:bottom;padding:0 4px}
th small{display:block;color:var(--mute);font-weight:400;max-width:360px;font-size:11px;line-height:1.35}
td.card{vertical-align:middle;width:130px}
td.card b{display:block}
td.card img{width:120px;border-radius:6px;margin-top:6px;opacity:.85}
.cell{display:flex;gap:6px}
.cell img{width:min(17vw,230px);aspect-ratio:556/534;object-fit:cover;border-radius:6px;cursor:zoom-in;background:#000;border:1px solid var(--line)}
.miss{width:min(17vw,230px);aspect-ratio:556/534;border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--mute);font-size:12px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:8px}
#lb.open{display:flex}
#lb img{max-width:94vw;max-height:88vh}
#lb p{margin:0;color:var(--mute)}
</style>
</head>
<body>
<header>
  <h1>Guia de arte: 3 estilos × 6 cartas</h1>
  <button class="chip on" id="tGrain">com grão 0.9</button>
  <span style="color:var(--mute)">Krea 2 Anime, t2i, seeds 1000 e 2024. Mesmo texto de assunto; só muda o bloco de estilo.</span>
  <a href="index.html">galeria completa</a>
</header>
<div class="wrap"><table id="t"></table></div>
<div id="lb"><img id="lbImg" alt=""><p id="lbCap"></p></div>
<script>
const STYLES = [
  ['gouache2', 'A · Guache seco', 'Sua favorita: guache opaco, pincel seco, papel aparecendo, bordas suaves.'],
  ['poster', 'B · Guache pôster', 'Formas chapadas, paleta de 5 cores, sombra em 2 tons, bordas firmes.'],
  ['inkwash', 'C · Nanquim + guache', 'Contorno de pincel grosso-fino, aguada vazando da linha (o guia atual do jogo).'],
];
const CARDS = ['rat_king', 'elder_dragon', 'death_knight', 'goblin_dynamiter', 'rat_burrow', 'weakness_curse'];
const SEEDS = [1000, 2024];
let grain = true, files = new Set(), names = {};
function render() {
  const t = document.getElementById('t');
  let h = '<tr><th></th>' + STYLES.map(s => `<th>${s[1]}<small>${s[2]}</small></th>`).join('') + '</tr>';
  for (const c of CARDS) {
    h += `<tr><td class="card"><b>${names[c] || c}</b><small style="color:var(--mute)">${c}</small><img src="${c}/_original.png" title="arte atual" alt=""></td>`;
    for (const [st] of STYLES) {
      h += '<td><div class="cell">' + SEEDS.map(sd => {
        const base = `${c}/krea2anime__${st}__t2i__s${sd}`;
        const f = grain && files.has(base + '__grain90.png') ? base + '__grain90.png' : base + '.png';
        return files.has(f) ? `<img src="${f}" data-cap="${names[c] || c} · ${st} · seed ${sd}" alt="">` : `<div class="miss">gerando…</div>`;
      }).join('') + '</div></td>';
    }
    h += '</tr>';
  }
  t.innerHTML = h;
  t.querySelectorAll('.cell img').forEach(im => im.onclick = () => {
    document.getElementById('lbImg').src = im.src; document.getElementById('lbCap').textContent = im.dataset.cap;
    document.getElementById('lb').classList.add('open');
  });
}
document.getElementById('lb').onclick = () => document.getElementById('lb').classList.remove('open');
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('lb').classList.remove('open'); });
document.getElementById('tGrain').onclick = e => { grain = !grain; e.target.classList.toggle('on'); render(); };
fetch('gallery.json?' + Date.now()).then(r => r.json()).then(d => {
  d.cards.forEach(c => { names[c.id] = c.name; c.images.forEach(i => files.add(i.file)); });
  render();
});
</script>
</body>
</html>
