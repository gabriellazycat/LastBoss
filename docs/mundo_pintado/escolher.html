<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mundo pintado · escolher</title>
<style>
:root {
  --paper: #ece4d4; --paper2: #f6f0e3; --ink: #3c2a1e; --muted: #7a6656; --line: #cbbda6;
  --accent: #8e2b22; --sel: #2f6b5a;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.4 "Alegreya Sans", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--paper2); border-bottom: 1px solid var(--line);
  padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font-size: 20px; margin: 0 8px 0 0; }
.tabs, .modes { display: flex; gap: 6px; flex-wrap: wrap; }
button { font: inherit; border: 1px solid var(--line); background: #fff8ec; color: var(--ink); border-radius: 6px;
  padding: 6px 12px; cursor: pointer; }
button.on { background: var(--ink); color: var(--paper2); border-color: var(--ink); }
.pick { margin-left: auto; font-weight: 600; }
.pick b { color: var(--sel); }
main { padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 560px), 1fr)); gap: 16px; }
.card { background: var(--paper2); border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.card.chosen { border-color: var(--sel); box-shadow: 0 0 0 3px #2f6b5a40; }
.card .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
.card .name { font-weight: 700; }
.card .desc { color: var(--muted); font-size: 14px; }
.card .bar button { margin-left: auto; }
.card img { display: block; width: 100%; cursor: zoom-in; aspect-ratio: 16 / 9; object-fit: cover; background: #ddd; }
.ref { display: flex; gap: 12px; align-items: center; margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.ref img { width: 120px; border-radius: 4px; border: 1px solid var(--line); }
/* comparação */
.cmp { max-width: 1600px; margin: 0 auto; }
.cmp .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: #fff8ec; color: var(--ink); }
.slider { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border-radius: 8px; user-select: none; background: #000; }
.slider img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.slider .top { clip-path: inset(0 0 0 50%); }
.slider .handle { position: absolute; top: 0; bottom: 0; left: 50%; width: 3px; background: #fff; box-shadow: 0 0 6px #0008; }
.slider .lab { position: absolute; top: 8px; padding: 3px 8px; background: #000a; color: #fff; border-radius: 4px; font-size: 13px; }
/* tela cheia */
.zoom { position: fixed; inset: 0; background: #000e; display: none; z-index: 10; align-items: center; justify-content: center; flex-direction: column; }
.zoom.on { display: flex; }
.zoom img { max-width: 100vw; max-height: calc(100vh - 56px); }
.zoom .cap { color: #fff; padding: 10px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
.zoom .cap button { background: #fff2; color: #fff; border-color: #fff4; }
@media (max-width: 640px) { .pick { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Mundo pintado em guache</h1>
  <div class="tabs" id="tabs"></div>
  <div class="modes" id="modes"></div>
  <div class="pick" id="pick"></div>
</header>
<main id="main"></main>
<div class="zoom" id="zoom"><img id="zimg" alt=""><div class="cap" id="zcap"></div></div>

<script>
const V = [
  ["Hoje", "Sem guache, como o jogo está agora"],
  ["S1 · Guache chapado", "Shader: luz e sombra em duas manchas, borda de pincel"],
  ["S2 · Aguado", "Shader: passagem mole, borda molhada"],
  ["S3 · Pincel largo", "Shader: três valores, bordas arrastadas"],
  ["T1 · IA dabs largos", "Folha de pincel da IA, luz de sempre"],
  ["T2 · IA aguado", "Folha de pincel da IA, luz de sempre"],
  ["T3 · IA pincel seco", "Folha de pincel da IA, luz de sempre"],
  ["C1 · Chapado + IA dabs", "S1 + T1"],
  ["C2 · Aguado + IA aguado", "S2 + T2"],
  ["C3 · Pincel largo + IA seco", "S3 + T3"],
];
const S = { run: "Começo da run", arena: "Arena do chefe", mesa: "Mesa do menu" };
const img = (v, s) => `web/v${v}_${s}.jpg`;
const store = {
  get(k, d) { try { const x = localStorage.getItem("mp_" + k); return x === null ? d : JSON.parse(x); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("mp_" + k, JSON.stringify(v)); } catch (e) {} },
};
let scene = store.get("scene", "run"), mode = store.get("mode", "grade"), chosen = store.get("chosen", null);
let cmpA = store.get("cmpA", 0), cmpB = store.get("cmpB", 1), zi = 0;

function header() {
  const t = document.getElementById("tabs");
  t.innerHTML = "";
  for (const k in S) {
    const b = document.createElement("button");
    b.textContent = S[k]; b.className = k === scene ? "on" : "";
    b.onclick = () => { scene = k; store.set("scene", k); render(); };
    t.appendChild(b);
  }
  const m = document.getElementById("modes");
  m.innerHTML = "";
  for (const [k, n] of [["grade", "Todas"], ["comparar", "Comparar duas"]]) {
    const b = document.createElement("button");
    b.textContent = n; b.className = k === mode ? "on" : "";
    b.onclick = () => { mode = k; store.set("mode", k); render(); };
    m.appendChild(b);
  }
  document.getElementById("pick").innerHTML = chosen === null
    ? "Clique em <b>Escolher</b> na sua favorita"
    : `Sua escolha: <b>${V[chosen][0]}</b> — me diga no chat`;
}

function choose(v) { chosen = chosen === v ? null : v; store.set("chosen", chosen); render(); }

function grid(main) {
  const ref = document.createElement("div");
  ref.className = "ref";
  ref.innerHTML = `<img src="web/ref.jpg" alt="Carta de referência"><span>Referência: carta nova da Rainha da Peste. Clique numa imagem para ver em tela cheia (setas ← → trocam).</span>`;
  main.appendChild(ref);
  const g = document.createElement("div");
  g.className = "grid";
  V.forEach(([n, d], v) => {
    const c = document.createElement("div");
    c.className = "card" + (chosen === v ? " chosen" : "");
    c.innerHTML = `<div class="bar"><div><div class="name">${n}</div><div class="desc">${d}</div></div>
      <button>${chosen === v ? "Escolhida ✓" : "Escolher"}</button></div><img loading="lazy" alt="${n}" src="${img(v, scene)}">`;
    c.querySelector("button").onclick = () => choose(v);
    c.querySelector("img").onclick = () => openZoom(v);
    g.appendChild(c);
  });
  main.appendChild(g);
}

function compare(main) {
  const w = document.createElement("div");
  w.className = "cmp";
  const opts = V.map(([n], v) => `<option value="${v}">${n}</option>`).join("");
  w.innerHTML = `<div class="row">Esquerda <select id="a">${opts}</select> Direita <select id="b">${opts}</select>
    <span class="desc">Arraste sobre a imagem para mover a divisória.</span></div>
    <div class="slider" id="sl"><img src="${img(cmpA, scene)}" alt=""><img class="top" id="top" src="${img(cmpB, scene)}" alt="">
    <div class="handle" id="h"></div><span class="lab" style="left:8px">${V[cmpA][0]}</span><span class="lab" style="right:8px">${V[cmpB][0]}</span></div>`;
  main.appendChild(w);
  const a = w.querySelector("#a"), b = w.querySelector("#b");
  a.value = cmpA; b.value = cmpB;
  a.onchange = () => { cmpA = +a.value; store.set("cmpA", cmpA); render(); };
  b.onchange = () => { cmpB = +b.value; store.set("cmpB", cmpB); render(); };
  const sl = w.querySelector("#sl"), top = w.querySelector("#top"), h = w.querySelector("#h");
  const move = (x) => {
    const r = sl.getBoundingClientRect();
    const p = Math.min(100, Math.max(0, (x - r.left) / r.width * 100));
    top.style.clipPath = `inset(0 0 0 ${p}%)`; h.style.left = p + "%";
  };
  sl.addEventListener("pointermove", (e) => { if (e.buttons || e.pointerType === "mouse") move(e.clientX); });
  sl.addEventListener("pointerdown", (e) => move(e.clientX));
}

function openZoom(v) {
  zi = v;
  document.getElementById("zimg").src = img(v, scene);
  const cap = document.getElementById("zcap");
  cap.innerHTML = `<button id="zp">←</button><span>${V[v][0]} — ${S[scene]}</span><button id="zn">→</button>
    <button id="zc">${chosen === v ? "Escolhida ✓" : "Escolher esta"}</button><button id="zx">Fechar (Esc)</button>`;
  cap.querySelector("#zp").onclick = (e) => { e.stopPropagation(); openZoom((v + 9) % 10); };
  cap.querySelector("#zn").onclick = (e) => { e.stopPropagation(); openZoom((v + 1) % 10); };
  cap.querySelector("#zc").onclick = (e) => { e.stopPropagation(); choose(v); openZoom(v); };
  cap.querySelector("#zx").onclick = closeZoom;
  document.getElementById("zoom").classList.add("on");
}
function closeZoom() { document.getElementById("zoom").classList.remove("on"); }
document.getElementById("zoom").onclick = (e) => { if (e.target.id === "zoom" || e.target.id === "zimg") closeZoom(); };
document.addEventListener("keydown", (e) => {
  if (!document.getElementById("zoom").classList.contains("on")) return;
  if (e.key === "Escape") closeZoom();
  if (e.key === "ArrowRight") openZoom((zi + 1) % 10);
  if (e.key === "ArrowLeft") openZoom((zi + 9) % 10);
});

function render() {
  header();
  const main = document.getElementById("main");
  main.innerHTML = "";
  (mode === "grade" ? grid : compare)(main);
}
render();
</script>
</body>
</html>
