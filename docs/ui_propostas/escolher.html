<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propostas de UI</title>
<style>
@font-face { font-family: "Alegreya"; src: url("../../assets/fonts/Alegreya-VF.ttf"); font-weight: 400 900; }
@font-face { font-family: "Alegreya Sans"; src: url("../../assets/fonts/AlegreyaSans-Medium.ttf"); font-weight: 500; }
@font-face { font-family: "Alegreya Sans"; src: url("../../assets/fonts/AlegreyaSans-Bold.ttf"); font-weight: 700; }
@font-face { font-family: "Alegreya Sans"; src: url("../../assets/fonts/AlegreyaSans-ExtraBold.ttf"); font-weight: 800; }
@font-face { font-family: "Fell SC"; src: url("../../assets/fonts/IMFellEnglishSC-Regular.ttf"); }
@font-face { font-family: "Fell It"; src: url("../../assets/fonts/IMFellEnglish-Italic.ttf"); }
@font-face { font-family: "Patrick"; src: url("../../assets/fonts/PatrickHand-Regular.ttf"); }
@font-face { font-family: "Marcellus"; src: url("../../assets/fonts/MarcellusSC-Regular.ttf"); }
@font-face { font-family: "Spectral"; src: url("../../assets/fonts/Spectral-SemiBold.ttf"); }

:root { --page: #e9e2d4; --pink: #3c2a1e; --line: #c9bca6; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: #3c2a1e; font: 16px/1.4 "Alegreya Sans", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 20; background: #f5efe3; border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
header h1 { font-size: 19px; margin: 0; }
.group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.group span { color: #7a6656; font-size: 14px; }
header button { font: inherit; border: 1px solid var(--line); background: #fffaf0; color: #3c2a1e; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
header button.on { background: #3c2a1e; color: #f5efe3; border-color: #3c2a1e; }
.pick { margin-left: auto; font-weight: 700; }
.pick b { color: #2f6b5a; }
main { padding: 14px; }
.intro { margin: 0 0 12px; color: #6b5848; max-width: 1100px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 620px), 1fr)); gap: 14px; }
.cell { background: #f5efe3; border: 2px solid var(--line); border-radius: 8px; overflow: hidden; }
.cell.chosen { border-color: #2f6b5a; box-shadow: 0 0 0 3px #2f6b5a40; }
.cell .bar { display: flex; align-items: center; gap: 8px; padding: 7px 10px; }
.cell .nm { font-weight: 800; }
.cell .ds { color: #7a6656; font-size: 14px; }
.cell .bar button { margin-left: auto; font: inherit; border: 1px solid var(--line); background: #fffaf0; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.frame { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; cursor: zoom-in; background: #222; }
.stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; }
.zoom { position: fixed; inset: 0; z-index: 30; background: #000e; display: none; flex-direction: column; align-items: center; justify-content: center; }
.zoom.on { display: flex; }
.zoom .frame { width: min(100vw, calc((100vh - 60px) * 16 / 9)); cursor: zoom-out; }
.zoom .cap { color: #fff; padding: 10px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.zoom .cap button { font: inherit; background: #fff2; color: #fff; border: 1px solid #fff4; border-radius: 6px; padding: 5px 11px; cursor: pointer; }
.fx { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.fx img { width: 100%; display: block; }

/* ============================ componentes (geometria comum) ============================ */
.bg-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.dim { position: absolute; inset: 0; background: rgba(30, 28, 34, .45); }
.ui { position: absolute; }
.skin { position: absolute; inset: 0; z-index: 0; }
.c { position: relative; z-index: 1; }
.timer { left: 22px; top: 20px; width: 190px; height: 86px; padding: 14px 20px; }
.timer .t { font-size: 40px; line-height: 1; }
.timer .s { font-size: 17px; margin-top: 4px; }
.route { left: 22px; top: 126px; width: 84px; height: 880px; padding: 22px 0; }
.route svg { position: relative; z-index: 1; display: block; margin: 0 auto; }
.route .tag { position: absolute; left: 96px; top: 470px; white-space: nowrap; font-size: 19px; padding: 4px 12px; z-index: 2; }
.hero { left: 700px; top: 16px; width: 520px; height: 158px; padding: 16px 26px 14px 104px; }
.hero .lv { position: absolute; left: 24px; top: 34px; width: 60px; height: 72px; z-index: 1; display: flex; align-items: center; justify-content: center; font-size: 30px; }
.hero .nm { font-size: 30px; line-height: 1.05; }
.hero .hp { position: relative; height: 26px; margin: 8px 0 6px; }
.hero .hp .fill { position: absolute; left: 0; top: 0; bottom: 0; }
.hero .hp .txt { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; z-index: 2; }
.hero .sub { font-size: 18px; }
.hero .ab { display: flex; gap: 6px; margin-top: 6px; }
.hero .ab i { width: 30px; height: 30px; border-radius: 50%; display: block; }
.btns { right: 22px; top: 20px; display: flex; gap: 10px; }
.btns .b { position: relative; width: 66px; height: 56px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
.elixir { left: 380px; top: 952px; width: 1160px; height: 104px; padding: 0 40px; display: flex; align-items: center; gap: 0; }
.elixir .drops { position: relative; z-index: 1; display: flex; gap: 46px; flex: 1; padding-left: 20px; }
.elixir .drops svg { width: 34px; height: 44px; }
.elixir .n { position: relative; z-index: 1; font-size: 30px; margin: 0 28px 0 10px; white-space: nowrap; }
.elixir .big { position: relative; z-index: 1; width: 64px; height: 82px; }
.elixir .gold { position: relative; z-index: 1; font-size: 30px; margin-left: 18px; white-space: nowrap; }
.boss { right: 22px; top: 86px; width: 370px; height: 312px; padding: 22px 26px; }
.boss .h { font-size: 28px; margin-bottom: 8px; }
.boss .row { display: flex; justify-content: space-between; font-size: 19px; margin-top: 6px; }
.boss .pb { height: 14px; margin: 4px 0 2px; position: relative; }
.boss .pb .fill { position: absolute; inset: 0; }
.relics { right: 22px; top: 414px; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
.relics .r { position: relative; font-size: 18px; padding: 4px 14px; }
.otitle { left: 50%; top: 190px; transform: translateX(-50%); padding: 14px 60px; font-size: 46px; white-space: nowrap; }
.ohint { left: 50%; top: 290px; transform: translateX(-50%); font-size: 20px; padding: 4px 18px; white-space: nowrap; }
.ocard { top: 418px; width: 274px; }
.ocard img { display: block; width: 100%; position: relative; z-index: 1; }
.ocard .ot { position: absolute; left: 50%; top: -52px; transform: translateX(-50%); white-space: nowrap; font-size: 20px; padding: 4px 16px; z-index: 2; }
.obtn { left: 50%; top: 838px; transform: translateX(-50%); width: 290px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 28px; }
.ledger { left: 150px; top: 110px; width: 1620px; height: 860px; padding: 50px 60px; display: grid; grid-template-columns: 1fr 1fr; gap: 70px; }
.ledger .pg { position: relative; z-index: 1; }
.ledger .h { font-size: 38px; }
.ledger .sh { font-size: 19px; margin-bottom: 18px; }
.ledger .it { display: flex; align-items: center; gap: 18px; padding: 12px 10px; position: relative; }
.ledger .it img { width: 150px; height: 92px; object-fit: cover; border-radius: 3px; }
.ledger .it .nmi { font-size: 27px; flex: 1; }
.ledger .it .pr { font-size: 24px; padding: 2px 14px; position: relative; }
.ledger .sv { display: flex; align-items: center; gap: 14px; font-size: 23px; padding: 10px; position: relative; }
.ledger .sv .pr { margin-left: auto; font-size: 22px; padding: 2px 12px; position: relative; }
.ledger .desc { margin-top: 16px; padding: 16px 18px; font-size: 21px; position: relative; }
.ledger .foot { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center; font-size: 22px; }
.ledger .exit { position: absolute; right: 0; bottom: 0; padding: 12px 28px; font-size: 26px; }
.menu { left: 104px; top: 134px; width: 800px; height: 792px; padding: 50px 56px; }
.menu .k { font-size: 21px; letter-spacing: .04em; }
.menu .ttl { font-size: 104px; line-height: 1; margin: 12px 0 10px; }
.menu .sub { font-size: 24px; margin-bottom: 30px; }
.menu .opts { display: flex; flex-direction: column; gap: 14px; width: 380px; }
.menu .opt { position: relative; height: 60px; display: flex; align-items: center; padding-left: 24px; font-size: 27px; }
.menu .por { position: absolute; right: 56px; bottom: 76px; width: 230px; z-index: 1; }
.menu .por img { width: 100%; display: block; }
.menu .pc { text-align: center; font-size: 22px; margin-top: 8px; }

/* botões e opções pintam o próprio fundo (a cor de destaque do tema), sem a pele do painel por cima */
.menu .opt > .skin, .obtn > .skin, .btns .b > .skin, .exit > .skin { display: none; }
/* fundo com borda pintada numa camada própria: o filtro nunca entorta o texto */
.hero .hp, .boss .pb, .hero .lv, .otitle { isolation: isolate; }
.hero .hp::before, .boss .pb::before, .hero .lv::before, .otitle::before { content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--b, transparent); filter: var(--f, none); box-shadow: var(--s, none); border-radius: var(--r, 0); }

/* ===== tema 1: papel aquarelado ===== */
.d1 { font-family: "Alegreya", serif; color: #3d3430; }
.d1 .skin { background: #f4eee2; filter: url(#torn); box-shadow: 0 6px 16px #0003; }
.d1 .skin::before { content: ""; position: absolute; inset: 8% 10% auto auto; width: 55%; height: 60%; border-radius: 50%;
  background: radial-gradient(closest-side, #b9cdbf99, #b9cdbf00); filter: url(#wash); }
.d1 .skin::after { content: ""; position: absolute; inset: 0; background: url(../../assets/textures/paint/T2/grass_v.png) 0 0 / 420px; mix-blend-mode: soft-light; opacity: .35; }
.d1 .hero .nm, .d1 .boss .h, .d1 .otitle, .d1 .ledger .h, .d1 .menu .ttl { font-weight: 800; color: #6e3a33; }
.d1 .hero .hp, .d1 .boss .pb { --b: #d9cfbf; --f: url(#rough); }
.d1 .hero .hp .fill, .d1 .boss .pb .fill { filter: url(#rough); }
.d1 .hero .hp .fill { background: #b4574b; }
.d1 .boss .pb .fill { background: #7e78a6; }
.d1 .hero .lv { --b: #c9b9a2; --f: url(#torn); color: #3d3430; }
.d1 .hero .ab i { background: #9fb7aa; filter: url(#rough); }
.d1 .hero .ab i:nth-child(2n) { background: #c99a86; }
.d1 .route .tag, .d1 .relics .r, .d1 .ohint, .d1 .ocard .ot, .d1 .ledger .pr, .d1 .ledger .desc { background: #efe6d3; box-shadow: 0 2px 6px #0002; }
.d1 .obtn, .d1 .menu .opt, .d1 .btns .b, .d1 .ledger .exit { background: #e6dccb; box-shadow: 0 3px 8px #0002; }
.d1 .menu .opt:first-child { background: #b8cdc2; }
.d1 .elixir .n, .d1 .elixir .gold { color: #5a4fa0; }

/* ===== tema 2: faixas de pincel ===== */
.d2 { font-family: "Alegreya Sans", sans-serif; color: #f4ede0; }
.d2 .skin { background: #46505a; filter: url(#brush); border-radius: 30px; }
.d2 .btns .b { background: #46505a; border-radius: 50%; }
.d2 .menu > .skin, .d2 .ledger > .skin { filter: none; border-radius: 14px; box-shadow: 0 8px 24px #0006; }
.d2 .timer .skin, .d2 .btns .b .skin { background: #46505a; }
.d2 .hero .nm, .d2 .boss .h, .d2 .otitle, .d2 .ledger .h, .d2 .menu .ttl, .d2 .menu .opt, .d2 .obtn { font-family: "Fell SC", serif; }
.d2 .hero .hp, .d2 .boss .pb { --b: #2c333a; --f: url(#brush); }
.d2 .hero .hp .fill, .d2 .boss .pb .fill { filter: url(#brush); }
.d2 .hero .hp .fill { background: #c24a3d; }
.d2 .boss .pb .fill { background: #8b7fd1; }
.d2 .hero .lv { --b: #b8a37f; --f: url(#brush); color: #2c2a28; }
.d2 .hero .ab i { background: #8fb3a3; }
.d2 .hero .ab i:nth-child(2n) { background: #d0866c; }
.d2 .otitle { --b: #a23a33; --f: url(#brush); }
.d2 .otitle span, .d2 .ocard .ot span { filter: none; }
.d2 .route .tag, .d2 .relics .r, .d2 .ohint, .d2 .ocard .ot, .d2 .ledger .pr, .d2 .ledger .desc { background: #46505ae6; }
.d2 .obtn, .d2 .ledger .exit { background: #a23a33; }
.d2 .menu .opt { background: #46505acc; }
.d2 .menu .opt:first-child { background: #a23a33; }
.d2 .menu .k, .d2 .menu .sub, .d2 .menu .pc, .d2 .ledger .sh { color: #e8dcc4; }
.d2 .elixir .n, .d2 .elixir .gold { color: #f0e6ff; }

/* ===== tema 3: caderno de esboço ===== */
.d3 { font-family: "Patrick", cursive; color: #3f3a36; }
.d3 .skin { background: #f6f2ea; border: 3px solid #4a4440; border-radius: 6px; filter: url(#pencil); box-shadow: 4px 5px 0 #4a444033; }
.d3 .hero .nm, .d3 .boss .h, .d3 .otitle, .d3 .ledger .h, .d3 .menu .ttl { font-family: "Fell It", serif; color: #8a3b2f; }
.d3 .hero .hp, .d3 .boss .pb { border: 2px solid #4a4440; filter: url(#pencil); background: #fff; }
.d3 .hero .hp .fill { background: repeating-linear-gradient(-45deg, #b4574b 0 6px, #b4574b99 6px 10px); }
.d3 .boss .pb .fill { background: repeating-linear-gradient(-45deg, #6f68a0 0 6px, #6f68a099 6px 10px); }
.d3 .hero .lv { border: 3px solid #4a4440; border-radius: 50%; filter: url(#pencil); background: #fff; }
.d3 .hero .ab i { border: 2px solid #4a4440; background: #dfe9e2; filter: url(#pencil); }
.d3 .route .tag, .d3 .relics .r, .d3 .ohint, .d3 .ocard .ot, .d3 .ledger .pr { background: #fffdf7; border: 2px solid #4a4440; border-radius: 4px; }
.d3 .obtn, .d3 .menu .opt, .d3 .btns .b, .d3 .ledger .exit { background: #fffdf7; border: 2.5px solid #4a4440; border-radius: 6px; }
.d3 .menu .opt:first-child { background: #f1dcd5; }
.d3 .otitle { background: #fffdf7; border: 3px solid #4a4440; transform: translateX(-50%) rotate(-1.5deg); }
.d3 .ledger .desc { border: 2px dashed #4a4440; }
.d3 .elixir .n, .d3 .elixir .gold { color: #4a4440; }

/* ===== tema 4: língua da carta ===== */
.d4 { font-family: "Alegreya", serif; color: #3b2e28; }
.d4 .skin { background: linear-gradient(#efe6d6, #e7dcc8); clip-path: polygon(14px 0, calc(100% - 14px) 0, 100% 14px, 100% calc(100% - 14px), calc(100% - 14px) 100%, 14px 100%, 0 calc(100% - 14px), 0 14px);
  box-shadow: inset 0 0 0 2px #e7dcc8, inset 0 0 0 4px #5a4638, inset 0 0 0 7px #e7dcc8, inset 0 0 0 8px #5a463888; }
.d4 .hero .nm, .d4 .boss .h, .d4 .ledger .h, .d4 .menu .ttl, .d4 .menu .opt, .d4 .obtn, .d4 .ocard .ot, .d4 .relics .r, .d4 .route .tag { font-family: "Fell SC", serif; }
.d4 .hero .nm { color: #f6eee0; background: #a7392f; display: inline-block; padding: 2px 24px 4px; clip-path: polygon(0 0, 100% 0, 96% 50%, 100% 100%, 0 100%, 4% 50%); }
.d4 .hero .hp, .d4 .boss .pb { background: #d7ccb9; box-shadow: inset 0 0 0 2px #5a4638; }
.d4 .hero .hp .fill { background: #a7392f; }
.d4 .boss .pb .fill { background: #6b56b8; }
.d4 .hero .lv { background: #6b56b8; color: #fff; clip-path: path("M30 0 C 44 22 60 36 60 50 A 30 30 0 1 1 0 50 C 0 36 16 22 30 0 Z"); }
.d4 .hero .ab i { background: #3e7d63; box-shadow: inset 0 0 0 2px #e7dcc8; }
.d4 .hero .ab i:nth-child(2n) { background: #a7392f; }
.d4 .route .tag, .d4 .relics .r, .d4 .ohint, .d4 .ledger .pr { background: #efe6d6; box-shadow: inset 0 0 0 2px #5a4638; }
.d4 .ocard .ot { background: #6b56b8; color: #fff; clip-path: polygon(0 0, 100% 0, 95% 50%, 100% 100%, 0 100%, 5% 50%); }
.d4 .otitle { font-family: "Fell SC", serif; background: #a7392f; color: #f6eee0; clip-path: polygon(0 0, 100% 0, 97% 50%, 100% 100%, 0 100%, 3% 50%); }
.d4 .obtn, .d4 .menu .opt, .d4 .btns .b, .d4 .ledger .exit { background: #efe6d6; box-shadow: inset 0 0 0 2px #5a4638, inset 0 0 0 5px #efe6d6, inset 0 0 0 6px #5a463880; }
.d4 .menu .opt:first-child { background: #a7392f; color: #f6eee0; box-shadow: none; }
.d4 .boss .h, .d4 .ledger .h, .d4 .menu .ttl { color: #a7392f; }
.d4 .elixir .n, .d4 .elixir .gold { color: #6b56b8; }

/* ===== tema 5: recorte de papel ===== */
.d5 { font-family: "Alegreya Sans", sans-serif; color: #2f2a2a; }
.d5 .skin { background: #a1bbb2; filter: url(#cut); box-shadow: 0 5px 0 #00000026; }
.d5 .hero .skin { background: #c9bfd8; }
.d5 .timer .skin { background: #e3be9b; }
.d5 .route .skin { background: #e8dfcf; }
.d5 .elixir .skin { background: #c9bfd8; }
.d5 .boss .skin { background: #e8dfcf; }
.d5 .ledger .skin { background: #e8dfcf; }
.d5 .menu .skin { background: #e8dfcf; }
.d5 .hero .nm, .d5 .boss .h, .d5 .otitle, .d5 .ledger .h, .d5 .menu .ttl, .d5 .obtn, .d5 .menu .opt { font-weight: 800; text-transform: uppercase; letter-spacing: .03em; }
.d5 .hero .hp, .d5 .boss .pb { --b: #ffffff80; --f: url(#cut); }
.d5 .hero .hp .fill { background: #b84f45; }
.d5 .boss .pb .fill { background: #6f62b0; }
.d5 .hero .lv { --b: #e3be9b; --f: url(#cut); }
.d5 .hero .ab i { background: #6f9c8b; filter: url(#cut); }
.d5 .hero .ab i:nth-child(2n) { background: #c07a62; }
.d5 .route .tag, .d5 .relics .r, .d5 .ocard .ot, .d5 .ledger .pr { background: #e3be9b; box-shadow: 0 3px 0 #0002; }
.d5 .ohint { background: #e8dfcf; }
.d5 .otitle { --b: #c08e86; --f: url(#cut); }
.d5 .obtn, .d5 .menu .opt, .d5 .btns .b, .d5 .ledger .exit { background: #a1bbb2; box-shadow: 0 4px 0 #0002; }
.d5 .menu .opt:first-child { background: #c08e86; }
.d5 .ledger .desc { background: #c9bfd8; }
.d5 .elixir .n, .d5 .elixir .gold { color: #3e3570; font-weight: 800; }

/* ===== tema 6: mapa aberto (o pergaminho do mapa da rota) ===== */
.d6 { font-family: "Fell It", serif; color: #3a2a1c; --ink: #3a2a1c; --red: #a8323a; }
.d6 .skin { background:
    radial-gradient(circle at 22% 30%, #b8975a2e, transparent 32%),
    radial-gradient(circle at 78% 70%, #b8975a26, transparent 36%),
    radial-gradient(circle at 60% 18%, #fff4d230, transparent 30%),
    radial-gradient(ellipse at center, #e8d6a8 0%, #dcc796 70%, #cdb581 100%);
  box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 8px #e3cf9f, inset 0 0 0 9.5px var(--ink), inset 0 0 36px #a8844a66, 0 6px 18px #0004; }
.d6 .hero .nm, .d6 .boss .h, .d6 .ledger .h, .d6 .menu .ttl, .d6 .menu .opt, .d6 .obtn, .d6 .otitle, .d6 .btns .b, .d6 .ledger .exit, .d6 .relics .r, .d6 .route .tag, .d6 .ocard .ot, .d6 .menu .k { font-family: "Fell SC", serif; }
.d6 .hero .nm { font-size: 32px; }
.d6 .hero .hp, .d6 .boss .pb { --b: #cdb581; box-shadow: inset 0 0 0 2px var(--ink); }
.d6 .hero .hp .fill { background: var(--red); inset: 3px auto 3px 3px; }
.d6 .boss .pb .fill { background: #5e4a8a; inset: 3px; }
.d6 .hero .hp .txt { color: #f6ead0; }
.d6 .hero .lv { --b: #e8d6a8; border-radius: 50%; box-shadow: 0 0 0 3px var(--ink), 0 0 0 7px #e3cf9f, 0 0 0 9px var(--red); width: 62px; height: 62px; top: 40px; }
.d6 .hero .lv::before { border-radius: 50%; }
.d6 .hero .ab i { background: #e8d6a8; box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 5px #e8d6a8, inset 0 0 0 7px var(--red); }
.d6 .route circle { fill: #e8d6a8; stroke: var(--ink); stroke-width: 2.5; }
.d6 .route circle:last-of-type { fill: var(--red); }
.d6 .route line { stroke: var(--ink); stroke-dasharray: 3 5; opacity: .7; }
.d6 .route rect { fill: var(--red); }
.d6 .route .tag, .d6 .relics .r, .d6 .ohint, .d6 .ledger .pr { background: #e3cf9f; box-shadow: inset 0 0 0 1.5px var(--ink); }
.d6 .ocard .ot { background: #e3cf9f; box-shadow: inset 0 0 0 2px var(--ink), inset 0 0 0 5px #e3cf9f, inset 0 0 0 6px var(--ink); }
.d6 .otitle { --b: #e3cf9f; color: var(--ink); padding: 16px 70px; }
.d6 .otitle::before { box-shadow: inset 0 0 0 3px var(--ink), inset 0 0 0 8px #e3cf9f, inset 0 0 0 9.5px var(--ink); }
.d6 .otitle::after { content: ""; position: absolute; left: -54px; right: -54px; top: 18px; bottom: -16px; z-index: -2;
  background: linear-gradient(#cdb37c, #bfa36a); clip-path: polygon(0 0, 100% 0, calc(100% - 28px) 50%, 100% 100%, 0 100%, 28px 50%); }
.d6 .obtn, .d6 .menu .opt, .d6 .btns .b, .d6 .ledger .exit { background: #e3cf9f; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 6px #e3cf9f, inset 0 0 0 7px var(--ink); }
.d6 .menu .opt:first-child { background: var(--red); color: #f6ead0; box-shadow: inset 0 0 0 2.5px var(--ink), inset 0 0 0 6px var(--red), inset 0 0 0 7px #f6ead0aa; }
.d6 .menu .ttl { font-size: 96px; }
.d6 .boss .h, .d6 .ledger .h { color: var(--ink); }
.d6 .ledger .desc { border-top: 1.5px solid var(--ink); border-bottom: 1.5px solid var(--ink); }
.d6 .ledger::after { content: ""; position: absolute; left: 50%; top: 40px; bottom: 40px; border-left: 2px dashed #3a2a1c66; z-index: 1; }
.d6 .elixir .n, .d6 .elixir .gold { color: var(--ink); font-family: "Fell SC", serif; }
.d6 .timer .t { font-family: "Fell SC", serif; }
.deco { display: none; position: absolute; z-index: 1; width: 150px; height: 150px; pointer-events: none; }
.d6 .deco { display: block; }

/* mapa aberto: nada reto — papel torto de borda irregular, linhas à mão, desenhos do mapa nos espaços vazios */
.doodle { display: none; position: absolute; z-index: 1; pointer-events: none; overflow: visible; }
.d6 .doodle { display: block; }
.d6 .doodle { filter: url(#mapline); }
.d6 .deco { z-index: 2; }
.d6 .deco circle:first-child { fill: #e3cf9f; }
.d6 .menu .por { bottom: 168px; }
.ledger .foot .pr { position: relative; }
.d6 .skin { filter: url(#mapedge); border-radius: 16px 7px 20px 9px / 9px 18px 7px 15px; }
.d6 .hero > .skin { transform: rotate(-0.6deg); }
.d6 .timer > .skin { transform: rotate(1deg); }
.d6 .route > .skin { transform: rotate(0.35deg); }
.d6 .elixir > .skin { transform: rotate(-0.3deg); }
.d6 .boss > .skin { transform: rotate(0.7deg); }
.d6 .ledger > .skin { transform: rotate(-0.35deg); }
.d6 .menu > .skin { transform: rotate(-0.7deg); }
.d6 .hero .hp, .d6 .boss .pb { box-shadow: none; --s: inset 0 0 0 2px #3a2a1c; --f: url(#mapline); --r: 4px 8px 5px 9px; }
.d6 .hero .hp .fill, .d6 .boss .pb .fill { filter: url(#mapline); border-radius: 3px 7px 4px 6px; }
.d6 .otitle::before, .d6 .otitle::after { filter: url(#mapline); }
.d6 :is(.menu .opt, .obtn, .btns .b, .ledger .exit, .relics .r, .route .tag, .ocard .ot, .ohint, .ledger .pr) { background: none !important; box-shadow: none !important; isolation: isolate; }
.d6 :is(.menu .opt, .obtn, .btns .b, .ledger .exit, .relics .r, .route .tag, .ocard .ot, .ohint, .ledger .pr)::after { content: ""; position: absolute; inset: 0; z-index: -1;
  background: var(--pb, #e3cf9f); box-shadow: var(--ps, inset 0 0 0 1.6px #3a2a1c); filter: url(#mapline); border-radius: 6px 10px 5px 9px / 9px 5px 10px 6px; }
.d6 :is(.menu .opt, .obtn, .btns .b, .ledger .exit, .ocard .ot) { --ps: inset 0 0 0 2.5px #3a2a1c, inset 0 0 0 6px #e3cf9f, inset 0 0 0 7px #3a2a1c; }
.d6 .menu .opt:first-child { --pb: #a8323a; --ps: inset 0 0 0 2.5px #3a2a1c, inset 0 0 0 6px #a8323a, inset 0 0 0 7px #f6ead0aa; }
.d6 .menu .opt:nth-child(2) { transform: rotate(0.4deg); }
.d6 .menu .opt:nth-child(3) { transform: rotate(-0.3deg); }
.d6 .menu .opt:nth-child(4) { transform: rotate(0.25deg); }
.d6 .relics .r:nth-child(odd) { transform: rotate(-0.8deg); }
.d6 .relics .r:nth-child(even) { transform: rotate(0.6deg); }
.d6 .ocard:nth-of-type(odd) .ot { transform: translateX(-50%) rotate(-1deg); }
.d6 .ledger::after { border-left: none; background: none; width: 2px; left: calc(50% - 1px);
  background-image: linear-gradient(#3a2a1c66 50%, transparent 0); background-size: 2px 14px; filter: url(#mapline); }
.d6 .ledger .desc { border: none; position: relative; }
.d6 .ledger .desc::after { content: ""; position: absolute; inset: 0; border-top: 1.6px solid #3a2a1c; border-bottom: 1.6px solid #3a2a1c; filter: url(#mapline); }

/* ===== refazer menu e loja (mapa aberto) ===== */
.rf { position: absolute; }
.rf-p { position: absolute; }
.rf-p > .skin { position: absolute; inset: 0; }
.rf-ban { position: absolute; text-align: center; isolation: isolate; font-family: "Fell SC", serif; color: #3a2a1c; padding: 10px 40px; }
.rf-ban::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #e3cf9f; filter: url(#mapline);
  box-shadow: inset 0 0 0 3px #3a2a1c, inset 0 0 0 8px #e3cf9f, inset 0 0 0 9.5px #3a2a1c; }
.rf-ban::after { content: ""; position: absolute; left: -50px; right: -50px; top: 22px; bottom: -18px; z-index: -2; filter: url(#mapline);
  background: linear-gradient(#cdb37c, #bfa36a); clip-path: polygon(0 0, 100% 0, calc(100% - 30px) 50%, 100% 100%, 0 100%, 30px 50%); }
.rf-ban .k { font-size: 17px; letter-spacing: .05em; }
.rf-ban .t { line-height: 1; }
.rf-node { position: absolute; text-align: center; transform: translate(-50%, -50%); }
.rf-node svg { display: block; margin: 0 auto; overflow: visible; }
.rf-node .lb { font-family: "Fell SC", serif; font-size: 30px; color: #3a2a1c; margin-top: 4px; white-space: nowrap; text-shadow: 0 0 6px #e8d6a8, 0 0 3px #e8d6a8; }
.rf-node.main .lb { color: #a8323a; font-size: 36px; }
.rf-node .hint { font-family: "Fell It", serif; font-size: 19px; color: #5a4632; white-space: nowrap; text-shadow: 0 0 5px #e8d6a8; }
.rf-txt { position: absolute; font-family: "Fell It", serif; color: #3a2a1c; }
.rf-sc { font-family: "Fell SC", serif; }
.rf-frame { position: absolute; padding: 10px; isolation: isolate; }
.rf-frame::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #e3cf9f; filter: url(#mapline); box-shadow: inset 0 0 0 2.5px #3a2a1c, inset 0 0 0 6px #e3cf9f, inset 0 0 0 7px #3a2a1c; }
.rf-frame img { display: block; width: 100%; }
.rf-opt { position: relative; isolation: isolate; font-family: "Fell SC", serif; color: #3a2a1c; }
.rf-box::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #e3cf9f; filter: url(#mapline); box-shadow: inset 0 0 0 2.5px #3a2a1c, inset 0 0 0 6px #e3cf9f, inset 0 0 0 7px #3a2a1c; border-radius: 6px 10px 5px 9px / 9px 5px 10px 6px; }
.rf-box.red { color: #f6ead0; }
.rf-box.red::before { background: #a8323a; box-shadow: inset 0 0 0 2.5px #3a2a1c, inset 0 0 0 6px #a8323a, inset 0 0 0 7px #f6ead0aa; }
.rf-fold { position: absolute; top: 0; bottom: 0; width: 70px; pointer-events: none; z-index: 1;
  background: linear-gradient(90deg, transparent, #8a6a3a22 40%, #8a6a3a44 49%, #fff6d855 51%, #fff6d822 60%, transparent); }
.rf-ruled { position: absolute; background-image: repeating-linear-gradient(transparent 0 45px, #3a2a1c2a 45px 46.5px); }
.rf-entry { position: absolute; display: flex; align-items: flex-end; gap: 10px; font-family: "Fell It", serif; font-size: 27px; color: #3a2a1c; }
.rf-entry .lead { flex: 1; border-bottom: 2px dotted #3a2a1c99; margin-bottom: 8px; }
.rf-entry .pr { font-family: "Fell SC", serif; font-size: 26px; }
.rf-thumb { position: absolute; padding: 6px; isolation: isolate; }
.rf-thumb::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #f1e3bd; box-shadow: inset 0 0 0 2px #3a2a1c, 0 3px 6px #0003; filter: url(#mapline); }
.rf-thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.rf-tag { position: absolute; text-align: center; isolation: isolate; font-family: "Fell It", serif; color: #3a2a1c; padding: 14px 12px 10px; }
.rf-tag::before { content: ""; position: absolute; inset: 0; z-index: -1; background: #ead8aa; filter: url(#mapline);
  clip-path: polygon(14% 0, 86% 0, 100% 18%, 100% 100%, 0 100%, 0 18%); box-shadow: inset 0 0 0 2px #3a2a1c; }
.rf-tag::after { content: ""; position: absolute; left: 50%; top: 7px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; border: 2px solid #3a2a1c; background: #8a7a5a; }

/* ?bg=1: só o fundo desenhado (o jogo põe por cima os lugares, textos, cartas e botões) — tools/art/ui_kit/export_map_art.py */

function stageImg(d, sc) { return `<img class="bg-img" src="${d === 0 ? TODAY[sc] : SHOT(d, sc)}">`; }
function stage(d, sc) {
  if (d === 0) return `<div class="stage d0"><img class="bg-img" src="${TODAY[sc]}"></div>`;
  return `<div class="stage ${D[d][2]}">${SCREENS[sc]()}</div>`;
}
function fit(root) {
  root.querySelectorAll(".frame").forEach(f => { const st = f.querySelector(".stage"); if (st) st.style.transform = `scale(${f.clientWidth / 1920})`; });
}
function header() {
  const s = document.getElementById("scenes");
  s.innerHTML = "<span>Tela:</span>";
  for (const k in SC) { const b = document.createElement("button"); b.textContent = SC[k]; b.className = k === scene ? "on" : ""; b.onclick = () => { scene = k; store.set("scene", k); render(); }; s.appendChild(b); }
  const v = document.getElementById("views");
  v.innerHTML = "<span>Ver:</span>";
  for (const [k, n] of [["grid", "Telas"], ["redo", "Refazer: menu e loja"], ["fx", "Efeito Explosivo"]]) { const b = document.createElement("button"); b.textContent = n; b.className = k === view ? "on" : ""; b.onclick = () => { view = k; store.set("view", k); render(); }; v.appendChild(b); }
  document.getElementById("pick").innerHTML = chosen === null ? "Clique em <b>Escolher</b> na sua favorita" : `Sua escolha: <b>${D[chosen][0]}</b> — me diga no chat`;
}
function choose(d) { chosen = chosen === d ? null : d; store.set("chosen", chosen); render(); }
function render() {
  header();
  const m = document.getElementById("main");
  if (view === "redo") {
    m.innerHTML = `<p class="intro">Mapa aberto: 3 versões novas do menu e 3 da loja. Clique para ver grande.</p><div class="grid">${REDO.map(([k, n]) =>
      `<div class="cell"><div class="bar"><div class="nm">${n}</div></div><div class="frame" onclick="window.open('fotos/d6_${k}.jpg')"><img class="bg-img" src="fotos/d6_${k}.jpg"></div></div>`).join("")}</div>`;
    return;
  }
  if (view === "fx") {
    m.innerHTML = `<p class="intro">O "Explosivo" de hoje (variante 4) e as versões anteriores. Diga qual era a bonita.</p><div class="fx" id="fxg"></div>`;
    fetch("fx/lista.json").then(r => r.json()).then(L => { document.getElementById("fxg").innerHTML = L.map(x => `<div class="cell"><div class="bar"><div><div class="nm">${x.nome}</div><div class="ds">${x.desc}</div></div></div><img src="fx/${x.img}"></div>`).join(""); }).catch(() => { document.getElementById("fxg").innerHTML = "<p>As fotos do efeito ainda estão sendo feitas.</p>"; });
    return;
  }
  m.innerHTML = `<p class="intro">Maquetes: o mundo e as cartas são fotos reais do jogo; só a interface é nova. Clique numa tela para ver grande (setas ← → trocam a direção).</p><div class="grid" id="g"></div>`;
  const g = document.getElementById("g");
  D.forEach(([n, ds], d) => {
    const c = document.createElement("div");
    c.className = "cell" + (chosen === d ? " chosen" : "");
    c.innerHTML = `<div class="bar"><div><div class="nm">${n}</div><div class="ds">${ds}</div></div>${d ? `<button>${chosen === d ? "Escolhida ✓" : "Escolher"}</button>` : ""}</div><div class="frame">${stageImg(d, scene)}</div>`;
    if (d) c.querySelector("button").onclick = () => choose(d);
    c.querySelector(".frame").onclick = () => zoom(d);
    g.appendChild(c);
  });
  requestAnimationFrame(() => fit(g));
}
let zd = 0;
function zoom(d) {
  zd = d;
  const z = document.getElementById("zoom");
  document.getElementById("zf").innerHTML = stageImg(d, scene);
  document.getElementById("zc").innerHTML = `<button id="p">←</button><span>${D[d][0]} — ${SC[scene]}</span><button id="n">→</button>${d ? `<button id="ch">${chosen === d ? "Escolhida ✓" : "Escolher esta"}</button>` : ""}<button id="x">Fechar (Esc)</button>`;
  z.classList.add("on");
  fit(z);
  z.querySelector("#p").onclick = () => zoom((d + 6) % 7);
  z.querySelector("#n").onclick = () => zoom((d + 1) % 7);
  if (d) z.querySelector("#ch").onclick = () => { choose(d); zoom(d); };
  z.querySelector("#x").onclick = () => z.classList.remove("on");
}
document.getElementById("zf").onclick = () => document.getElementById("zoom").classList.remove("on");
document.addEventListener("keydown", e => {
  const z = document.getElementById("zoom");
  if (!z.classList.contains("on")) return;
  if (e.key === "Escape") z.classList.remove("on");
  if (e.key === "ArrowRight") zoom((zd + 1) % 7);
  if (e.key === "ArrowLeft") zoom((zd + 6) % 7);
});
window.addEventListener("resize", () => { fit(document); });
// ?solo=<direção>&tela=<tela>: só a maquete, 1920x1080 em escala 1 (tools/art/render_ui_mockups.sh tira a foto).
const Q = new URLSearchParams(location.search);
if (Q.has("solo")) {
  if (Q.has("bg")) document.documentElement.classList.add("bgonly");
  document.body.innerHTML = document.querySelector("svg").outerHTML + `<div style="position:relative;width:1920px;height:1080px;overflow:hidden">${stage(+Q.get("solo"), Q.get("tela"))}</div>`;
  document.body.style.margin = "0"; if (Q.has("bg")) { document.body.classList.add("bgonly"); document.documentElement.style.background = "transparent"; }
} else {
  render();
}
</script>
</body>
</html>
