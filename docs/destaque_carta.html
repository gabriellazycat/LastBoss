.gem{position:absolute;left:-8px;top:-8px;width:30px;height:30px;border-radius:50%;background:#2f6fb0;border:2px solid #e9d9a8;color:#fff;font:700 15px Georgia;display:grid;place-items:center;z-index:3}
.card i{display:none}
/* efeitos: ativos em :hover e :focus-visible */
body.f1 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(0)!important;z-index:5;box-shadow:0 0 0 3px #f2c14e,0 18px 20px -6px #000a}
body.f2 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(0)!important;z-index:5;box-shadow:0 18px 20px -6px #000a}
body.f2 .card:is(:hover,:focus-visible) i{display:block;position:absolute;width:22px;height:22px;border:4px solid #f2c14e;z-index:4}
body.f2 .card:hover i.tape,body.f2 .card:hover i.shine,body.f2 .card:focus-visible i.tape,body.f2 .card:focus-visible i.shine{display:none!important}
body.f2 .card i:nth-of-type(1){left:-8px;top:-8px;border-right:0;border-bottom:0}
body.f2 .card i:nth-of-type(2){right:-8px;top:-8px;border-left:0;border-bottom:0}
body.f2 .card i:nth-of-type(3){left:-8px;bottom:-8px;border-right:0;border-top:0}
body.f2 .card i:nth-of-type(4){right:-8px;bottom:-8px;border-left:0;border-top:0}
body.f3 .card:is(:hover,:focus-visible){transform:translateY(-34px) scale(1.12) rotate(0)!important;z-index:5;box-shadow:0 0 0 1.5px #f2c14e,0 30px 34px -4px #000c}
body.f4 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(-2deg)!important;z-index:5;box-shadow:0 18px 20px -6px #000a}
body.f4 .card:is(:hover,:focus-visible) i.tape{display:block;position:absolute;left:50%;top:-12px;width:70px;height:22px;margin-left:-35px;background:rgba(200,60,50,.88);transform:rotate(-3deg);z-index:4}
body.f5 .card{overflow:hidden}
body.f5 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(0)!important;z-index:5;box-shadow:0 0 0 3px #f2c14e,0 18px 20px -6px #000a}
body.f5 .card:is(:hover,:focus-visible) i.shine{display:block;position:absolute;top:0;bottom:0;width:50px;background:rgba(255,255,255,.5);transform:skewX(-18deg);animation:sw 1.6s ease-in-out infinite;z-index:4}
@keyframes sw{0%{left:-70px}70%,100%{left:210px}}
body.f6 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(0)!important;z-index:5;animation:br 1.5s ease-in-out infinite}
@keyframes br{0%,100%{box-shadow:0 0 0 3px #f2c14e,0 18px 20px -6px #000a}50%{box-shadow:0 0 0 3px #fff0c0,0 0 24px 4px #f2c14e66,0 18px 20px -6px #000a}}
body.f0 .card:is(:hover,:focus-visible){transform:translateY(-26px) rotate(0)!important;z-index:5;box-shadow:0 0 0 4px #f2c14e,0 0 14px 12px #ffc83099,inset 0 0 20px 12px #ffc83099}
.hint{text-align:center;color:#a99f8c;padding:6px}
</style>
<body class="f1">
<h1>Destaque da carta selecionada</h1>
<p class="s">Passe o mouse ou use Tab e as setas na mão. Escolha o efeito abaixo.</p>
<div class="tabs" id="t"></div>
<div class="hand" id="h"></div>
<div class="hint" id="n"></div>
<script>
const opts=[["f0","Atual (feio)"],["f1","1 Fio dourado"],["f2","2 Colchetes"],["f3","3 Cresce"],["f4","4 Fita crepe"],["f5","5 Reflexo"],["f6","6 Respira"]];
const t=document.getElementById('t'),h=document.getElementById('h');
opts.forEach(([c,l])=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{document.body.className=c;[...t.children].forEach(x=>x.classList.toggle('on',x===b))};if(c==='f1')b.classList.add('on');t.appendChild(b)});
const names=["Carniçal","Carniçal","Carniçal","Carniçal","Carniçal"];
names.forEach((n,i)=>{const d=document.createElement('div');d.className='card';d.tabIndex=0;d.innerHTML='<div class="gem">'+(i+1)+'</div><i></i><i></i><i></i><i></i><i class="tape"></i><i class="shine"></i><div class="nm">'+n+'</div><div class="art"></div><div class="tx">Invoca 2 carniçais.<br>Causam 4 de dano.</div>';
d.querySelectorAll('i').forEach(x=>{if(x.className==='tape')x.className='tape';});
d.addEventListener('keydown',e=>{if(e.key==='ArrowRight')d.nextElementSibling?.focus();if(e.key==='ArrowLeft')d.previousElementSibling?.focus()});h.appendChild(d)});
</script>
</body></html>
